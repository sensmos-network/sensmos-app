name: sensmos_app
description: SENSMOS — sieć inteligentnych czujników
publish_to: 'none'
version: 1.5.94+131

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Networking
  http: ^1.2.0
  web_socket_channel: ^2.4.0

  # RemoteTerminal (SSH przez tunel noda + emulator terminala)
  dartssh2: ^4.1.0
  xterm: ^4.0.0

  # BLE + discovery
  flutter_blue_plus: ^1.31.15
  multicast_dns: ^0.3.2+6

  # QR scan (adres odbiorcy przy wysyłce GALU)
  mobile_scanner: ^5.2.3

  # Crypto wallet
  web3dart: ^3.0.3
  wallet: ^0.0.18   # EthereumAddress/EtherAmount (od web3dart 3 poza nim)
  ed25519_hd_key: ^2.2.0
  pointycastle: ^4.0.0

  # HMAC-SHA256 do dowodu otwarcia tunelu (pairing_service) — była tranzytywna, teraz wprost
  crypto: ^3.0.3

  # Kryptografia plikow i klient Store — WSPOLNE z klientem na komputer.
  sensmos_store:
    path: ../SHARED/sensmos_store

  # Store: wybór pliku z telefonu (strumień, bez ładowania do RAM) i zapis pobranego (SAF)
  file_picker: ^10.3.3

  # Secure storage (Keychain / Keystore)
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  webview_flutter: ^4.10.0

  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # GPS (app-proof lokalizacji noda)
  geolocator: ^12.0.0

  # Charts
  fl_chart: ^0.66.0

  # QR (odbiĂłr MATIC, adres portfela)
  qr_flutter: ^4.1.0

  # Push (FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.0
  # Wersja aplikacji czytana z pakietu — patrz Config.initVersion (koniec z ręczną stałą)
  package_info_plus: ^8.0.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
